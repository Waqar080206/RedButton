<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Red Button RAG Test Console</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: #111; color: #eee; }
  h1 { font-size: 1.4rem; }
  section { border: 1px solid #333; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
  input, select, button, textarea { font-size: 1rem; padding: 0.4rem; margin: 0.2rem 0; }
  input[type=text], textarea { width: 100%; box-sizing: border-box; background: #1c1c1c; color: #eee; border: 1px solid #444; }
  button { cursor: pointer; background: #d13c3c; color: #fff; border: none; border-radius: 4px; padding: 0.5rem 1rem; }
  button:hover { background: #e85555; }
  #docList { list-style: none; padding: 0; }
  #docList li { padding: 0.4rem 0; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
  #chatLog { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1rem; }
  .msg { padding: 0.6rem 0.8rem; border-radius: 6px; }
  .msg.user { background: #22344a; align-self: flex-end; }
  .msg.bot { background: #262626; }
  .citation { font-size: 0.85rem; color: #aaa; margin-top: 0.4rem; }
  .low-confidence { color: #e8b34c; }
  .msg.bot .md p { margin: 0 0 0.6rem; }
  .msg.bot .md p:last-child { margin-bottom: 0; }
  .msg.bot .md ul, .msg.bot .md ol { margin: 0 0 0.6rem; padding-left: 1.4rem; }
  .msg.bot .md li { margin: 0.15rem 0; }
  .msg.bot .md code { background: #1c1c1c; border: 1px solid #333; border-radius: 3px; padding: 0.1rem 0.3rem; font-size: 0.9em; }
  .msg.bot .md pre { background: #1c1c1c; border: 1px solid #333; border-radius: 4px; padding: 0.6rem; overflow-x: auto; }
  .msg.bot .md pre code { border: none; padding: 0; }
  .msg.bot .md h1, .msg.bot .md h2, .msg.bot .md h3 { margin: 0.4rem 0 0.4rem; font-size: 1.05rem; }
  .msg.bot .md strong { color: #fff; }
</style>
</head>
<body>
<h1>Red Button — RAG Test Console</h1>

<section>
  <h2>Upload manual / SOP</h2>
  <form id="uploadForm">
    <input type="file" id="fileInput" accept=".pdf,.docx,.txt" required>
    <select id="roleInput">
      <option value="admin">admin</option>
      <option value="supervisor">supervisor</option>
    </select>
    <input type="text" id="machineIdUpload" placeholder="machine_id (optional)">
    <button type="submit">Upload</button>
  </form>
</section>

<section>
  <h2>Documents</h2>
  <ul id="docList"></ul>
</section>

<section>
  <h2>Ask a question</h2>
  <input type="text" id="machineIdChat" placeholder="machine_id filter (optional)">
  <div id="chatLog"></div>
  <form id="chatForm">
    <input type="text" id="questionInput" placeholder="Ask about a machine..." required>
    <button type="submit">Ask</button>
    <button type="button" id="newConvoBtn">New conversation</button>
  </form>
</section>

<script>
const api = (path, opts) => fetch(path, opts).then(r => r.json());

let sessionId = localStorage.getItem('redbutton_session_id') || null;

document.getElementById('newConvoBtn').onclick = () => {
  sessionId = null;
  localStorage.removeItem('redbutton_session_id');
  document.getElementById('chatLog').innerHTML = '';
};

async function loadDocs() {
  const docs = await api('/documents');
  const list = document.getElementById('docList');
  list.innerHTML = '';
  docs.forEach(d => {
    const li = document.createElement('li');
    li.innerHTML = `<span>${d.filename} (${d.chunk_count} chunks${d.machine_id ? ', machine: ' + d.machine_id : ''})</span>`;
    const btn = document.createElement('button');
    btn.textContent = 'Delete';
    btn.onclick = async () => { await fetch(`/documents/${d.id}`, { method: 'DELETE' }); loadDocs(); };
    li.appendChild(btn);
    list.appendChild(li);
  });
}

document.getElementById('uploadForm').onsubmit = async (e) => {
  e.preventDefault();
  const file = document.getElementById('fileInput').files[0];
  const role = document.getElementById('roleInput').value;
  const machineId = document.getElementById('machineIdUpload').value;
  const fd = new FormData();
  fd.append('file', file);
  fd.append('role', role);
  fd.append('uploaded_by', role);
  if (machineId) fd.append('machine_id', machineId);
  await fetch('/documents/upload', { method: 'POST', body: fd });
  e.target.reset();
  loadDocs();
};

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Minimal, dependency-free markdown -> HTML. Escapes first so raw HTML in the
// LLM answer can never inject into the page; only a small whitelist of markdown
// constructs (headers, bold/italic, code/code blocks, lists, paragraphs) is rendered.
function renderMarkdown(raw) {
  const escaped = escapeHtml(raw);
  const codeBlocks = [];
  let text = escaped.replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push(`<pre><code>${code}</code></pre>`);
    return `__CODEBLOCK_${codeBlocks.length - 1}__`;
  });

  const lines = text.split('\n');
  const htmlParts = [];
  let listBuffer = [];
  let listType = null;

  function flushList() {
    if (listBuffer.length) {
      const tag = listType === 'ol' ? 'ol' : 'ul';
      htmlParts.push(`<${tag}>${listBuffer.map(li => `<li>${li}</li>`).join('')}</${tag}>`);
      listBuffer = [];
      listType = null;
    }
  }

  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  }

  for (const line of lines) {
    const headerMatch = line.match(/^(#{1,3})\s+(.*)/);
    const olMatch = line.match(/^\s*\d+\.\s+(.*)/);
    const ulMatch = line.match(/^\s*[-*]\s+(.*)/);

    if (headerMatch) {
      flushList();
      const level = headerMatch[1].length;
      htmlParts.push(`<h${level}>${inline(headerMatch[2])}</h${level}>`);
    } else if (olMatch) {
      if (listType !== 'ol') flushList();
      listType = 'ol';
      listBuffer.push(inline(olMatch[1]));
    } else if (ulMatch) {
      if (listType !== 'ul') flushList();
      listType = 'ul';
      listBuffer.push(inline(ulMatch[1]));
    } else if (line.trim() === '') {
      flushList();
    } else {
      flushList();
      htmlParts.push(`<p>${inline(line)}</p>`);
    }
  }
  flushList();

  return htmlParts
    .join('')
    .replace(/__CODEBLOCK_(\d+)__/g, (_, i) => codeBlocks[Number(i)]);
}

function addMessage(text, sender, extra) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  if (sender === 'bot') {
    const md = document.createElement('div');
    md.className = 'md';
    md.innerHTML = renderMarkdown(text);
    div.appendChild(md);
  } else {
    div.textContent = text;
  }
  if (extra) div.appendChild(extra);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

document.getElementById('chatForm').onsubmit = async (e) => {
  e.preventDefault();
  const question = document.getElementById('questionInput').value;
  const machineId = document.getElementById('machineIdChat').value;
  addMessage(question, 'user');
  document.getElementById('questionInput').value = '';

  const res = await api('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question, machine_id: machineId || null, session_id: sessionId }),
  });

  if (res.session_id) {
    sessionId = res.session_id;
    localStorage.setItem('redbutton_session_id', sessionId);
  }

  const citationsEl = document.createElement('div');
  citationsEl.className = 'citation';
  if (res.citations && res.citations.length) {
    citationsEl.textContent = 'Sources: ' + res.citations.map(c => `${c.filename} (chunk ${c.chunk_index})`).join(', ');
  } else if (!res.found_in_manuals) {
    citationsEl.classList.add('low-confidence');
    citationsEl.textContent = 'No matching manual content found.';
  }
  addMessage(res.answer, 'bot', citationsEl);
};

loadDocs();
</script>
</body>
</html>
